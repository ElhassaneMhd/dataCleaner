services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: datacleaner-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-datacleaner}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datacleaner-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: datacleaner-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datacleaner-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: datacleaner-backend
    environment:
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-datacleaner}
      DB_SSLMODE: disable
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      DNS_CACHE_TTL: ${DNS_CACHE_TTL:-3600}
      MX_CACHE_TTL: ${MX_CACHE_TTL:-3600}
      VALIDATOR_CONCURRENCY: ${VALIDATOR_CONCURRENCY:-1000}
      VALIDATOR_TIMEOUT_SECONDS: ${VALIDATOR_TIMEOUT_SECONDS:-3}
      VALIDATOR_MAX_RETRIES: ${VALIDATOR_MAX_RETRIES:-2}
      VALIDATOR_RETRY_DELAY_MS: ${VALIDATOR_RETRY_DELAY_MS:-500}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-random-string-in-production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      ENV: ${ENV:-production}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./backend/results:/root/results
      - ./backend/uploads:/root/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datacleaner-network

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: datacleaner-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - datacleaner-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  datacleaner-network:
    driver: bridge
